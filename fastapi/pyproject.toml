[project]
name = "service"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "alembic",
    "fastapi",
    "psycopg[binary]",
    "psycopg-pool",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "uvicorn"
]

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[tool.pytest]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests"]
